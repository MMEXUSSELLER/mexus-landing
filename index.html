<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MEXUS SELLER — Lanzamos y escalamos marcas en Amazon USA y México</title>
<meta name="description" content="Agencia mexicana certificada Amazon SPN. Operamos marcas en Seller Central (3P) y Vendor Central (1P) en USA y México. Atención directa con los fundadores.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#152232">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="MEXUS SELLER — Built by sellers, for sellers">
<meta property="og:description" content="Operamos marcas mexicanas en Amazon USA y México. Cross-border, PPC, listings y reportes — con atención directa de los fundadores.">
<meta property="og:locale" content="es_MX">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="stylesheet" href="styles.css?v=6">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body data-theme="light" data-accent="orange" data-card-style="flat">
<div id="root"></div>

<script type="text/babel" src="components/Icons.jsx"></script>
<script type="text/babel" src="components/Navbar.jsx"></script>
<script type="text/babel" src="components/Hero.jsx"></script>
<script type="text/babel" src="components/Sections1.jsx"></script>
<script type="text/babel" src="components/Sections2.jsx"></script>
<script type="text/babel" src="components/Sections3.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function App() {
  const [lang, setLang] = useState("es");

  // Reveal-on-scroll
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); });
    }, { threshold: 0.1, rootMargin: "0px 0px -60px 0px" });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <Navbar lang={lang} onLang={setLang} theme="light" />
      <Hero lang={lang} variant="bold" />
      <Services lang={lang} />
      <Process lang={lang} />
      <Brands lang={lang} />
      <Team lang={lang} />
      <Platform lang={lang} />
      <FAQ lang={lang} />
      <Contact lang={lang} />
      <Footer lang={lang} />
      <WhatsApp lang={lang} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
